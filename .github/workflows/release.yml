# Draft a release through the shared workflow. Run it from the Actions
# tab and choose the part of the version to raise. Publish the draft to
# create the tag.
#
# The release steps live in mattgrul/.github. This file only calls them,
# by path and commit SHA, and GitHub reads them from there on each run.
# A change there reaches every repository through a Dependabot pull
# request that moves the SHA.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "The part of the version to raise."
        type: choice
        options: [patch, minor, major]

jobs:
  release:
    uses: mattgrul/.github/.github/workflows/release.yml@c23d5e5f5c4d41571e6f22b8cbc2dc3322a720f3 # v4.0.2
    # The shared workflow gets no more than this job grants, and the
    # default token is read only.
    permissions:
      contents: write
    with:
      bump: ${{ inputs.bump }}
