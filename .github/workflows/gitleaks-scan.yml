# The required check "gitleaks-scan": no secret and no personal data in
# the files or the new commits. The scan and its rules live in
# mattgrul/.github, so a change there reaches every repository through a
# Dependabot pull request.
name: gitleaks-scan

on:
  pull_request:
  push:
    branches: [main, "*.x"]

permissions:
  contents: read

jobs:
  gitleaks-scan:
    # The scan runs in its own Docker image, so the Ubuntu version of
    # the runner does not change the result.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: mattgrul/.github/gitleaks-scan@412e34e76fa77c7364d436122e8d9c63976f991f # v1.0.1
