# The required check "test": the card generator's tests. They need only
# the standard library, so the runner's own Python runs them.
name: test

on:
  pull_request:
  push:
    branches: [main, "*.x"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m unittest -v
        working-directory: card
